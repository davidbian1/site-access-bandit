<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Mindful Access</title>
<style>
  body {
    font-family: -apple-system, Segoe UI, Arial, sans-serif;
    width: 320px;
    padding: 14px;
    background: #14161a;
    color: #e8e8ec;
  }
  h2 { font-size: 15px; margin: 0 0 10px; }
  .row { display: flex; align-items: center; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #262a31; font-size: 13px; }
  .row:last-child { border-bottom: none; }
  button {
    border: none; border-radius: 6px; padding: 6px 10px; font-size: 12px; font-weight: 600; cursor: pointer;
  }
  .primary { background: #8ab4f8; color: #14161a; }
  .danger { background: #3a2020; color: #f28b82; }
  .muted { color: #8b8f98; font-size: 12px; }
  #currentSite { margin-bottom: 14px; padding: 10px; border-radius: 8px; background: #1e2126; }
  #sites { max-height: 160px; overflow-y: auto; margin-bottom: 10px; }
  a { color: #8ab4f8; font-size: 12px; }
  #freeTimeSection { margin-top: 14px; padding-top: 12px; border-top: 1px solid #262a31; min-height: 4px; }
  #freeTimeActive { padding: 8px; border-radius: 8px; background: #1e2126; line-height: 1.4; font-size: 12px; }
  #endFreeTimeBtn { margin-top: 8px; }
  #freeTimePrompt { color: #a9adb4; font-size: 12px; margin-bottom: 6px; line-height: 1.4; }
  #freeTimeChips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    background: #1e2126; border: 1px solid #333844; color: #e8e8ec;
    border-radius: 999px; padding: 6px 12px; font-size: 12px; font-weight: 600;
  }
  .chip.suggested { background: #8ab4f8; color: #14161a; border-color: #8ab4f8; }
  #freeTimeLink {
    background: none; border: none; color: #8ab4f8; font-size: 12px; font-weight: 400;
    padding: 0; cursor: pointer; text-decoration: underline;
  }
</style>
</head>
<body>
  <div id="currentSite"></div>

  <h2>Managed sites</h2>
  <div id="sites"></div>

  <div id="freeTimeSection">
    <div id="freeTimeActive" class="muted" style="display:none;">
      <div id="freeTimeActiveText"></div>
      <button id="endFreeTimeBtn" class="danger">End free time now</button>
    </div>
    <div id="freeTimeSuggestion" style="display:none;">
      <div id="freeTimePrompt"></div>
      <div id="freeTimeChips"></div>
    </div>
    <button id="freeTimeLink" style="display:none;">Free time</button>
  </div>

  <a href="options.html" target="_blank">Open full settings &amp; history</a>

  <script type="module" src="popup.js"></script>
</body>
</html>
